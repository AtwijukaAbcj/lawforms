{% extends 'base.html' %}
{% block content %}
  <h2>New Net Family Property Statement</h2>
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
  {% endif %}

  {% if case_list %}
    <form method="get" style="margin-bottom:12px;">
      <label style="font-weight:700;">Select Case</label>
      <select name="case_id">
        <option value="">— None —</option>
        {% for c in case_list %}
          <option value="{{ c.id }}" {% if selected_case and selected_case.id == c.id %}selected{% endif %}>{{ c.court_file_number }} — {{ c.applicant_name }} vs {{ c.respondent_name }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="btn btn-secondary">Load Case</button>
    </form>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if selected_case %}
      <input type="hidden" name="case_id" value="{{ selected_case.id }}">
    {% endif %}
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
{% endblock %}
